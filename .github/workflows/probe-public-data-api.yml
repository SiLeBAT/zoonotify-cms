name: Probe Public Data API

# Daily anonymous permission probe of prod (yarn permissions:probe), which
# includes the Public Data API collections. Grants live in the database, so
# drift only shows live. On failure, opens one issue (or comments on the open
# one); the details stay off GitHub, as the repository is public.
#
# The schedule stays dormant until go-live: it only probes when the repository
# variable PUBLIC_DATA_API_LIVE is 'true' (Settings > Secrets and variables >
# Actions > Variables). Until prod serves every promised collection it would
# just re-report the known gap daily. Manual runs always probe.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: probe-public-data-api
  cancel-in-progress: false

jobs:
  probe:
    name: 'Probe prod'
    if: github.event_name != 'schedule' || vars.PUBLIC_DATA_API_LIVE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # A short wait rides out a blip (or a deploy in progress) before alerting.
      # The permission probe also checks denies, so its details could name a
      # leak: the repository is public, so neither the log nor the issue shows
      # them.
      - name: Probe the permissions anonymously
        id: probe
        run: |
          if yarn -s permissions:probe https://zoonotify.bfr.berlin/cms/api --wait 120 > /dev/null 2>&1; then
            echo "permission probe: pass"
          else
            echo "permission probe: FAIL"
            exit 1
          fi

      - name: Open or update the failure issue
        if: failure() && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Public Data API probe failing on prod'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/issue-body.md"
          echo "The permission probe failed on prod. Run \`yarn permissions:probe https://zoonotify.bfr.berlin/cms/api --report <file>\` on a trusted machine for the details." > "$body"
          printf '\nRun: %s\n' "$RUN_URL" >> "$body"

          number="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi
