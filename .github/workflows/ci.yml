name: Continuous Integration Workflow

# This workflow is triggered whenever a new PR is created on the develop branch
on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      # Fails on a content type that config.mjs leaves unclassified, and on a
      # committed api-reference/openapi.json that no longer matches the schemas.
      - name: Check API reference is up to date
        run: |
          yarn api-reference:generate
          if [ -n "$(git status --porcelain -- api-reference)" ]; then
            git diff -- api-reference
            echo "::error::api-reference/openapi.json is stale. Run 'yarn api-reference:generate', bump info.version in scripts/api-reference/base.mjs if the contract changed, and commit both."
            exit 1
          fi

      - name: Lint API reference
        run: npx --yes @redocly/cli@2.57.0 lint api-reference/openapi.json

      - name: Build
        run: yarn build

