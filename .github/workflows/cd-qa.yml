
name: Continuous Deployment Workflow QA

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build:
    name: 'Builds the strapi CMS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '18.20.5'
      - name: Install dependencies
        run: yarn install
      - name: Build
        run: yarn build

  deploy:
    name: 'Deploy to QA'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      # we need the branch name you just pushed (develop or PR head)
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Deploy to QA
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.QA_SERVER }}
          username: ${{ secrets.QA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.QA_PORT }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.QA_PATH }}"
            REPO_URL="https://github.com/SiLeBAT/zoonotify-cms.git"
            BRANCH="${{ steps.extract_branch.outputs.branch }}"

            # load shell profile if present
            [ -f ~/.bashrc ] && . ~/.bashrc || true
            [ -f ~/.profile ] && . ~/.profile || true

            # ensure Node 18.20.5 on the server if nvm exists (avoids engine mismatch)
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm install 18.20.5
              nvm use 18.20.5
            fi

            echo "==> Fresh clone into $APP_DIR"
            cd ~
            rm -rf "${APP_DIR}.old"
            [ -d "$APP_DIR" ] && mv "$APP_DIR" "${APP_DIR}.old" || true
            git clone "$REPO_URL" "$APP_DIR"

            echo "==> Put environment file"
            cp "$HOME/env.qa" "$APP_DIR/.env" || true

            cd "$APP_DIR"
            git fetch origin
            git checkout "$BRANCH" || git checkout -B "$BRANCH" "origin/$BRANCH"
            git pull --ff-only || true

            # ===== Ensure persistent uploads (inline, idempotent) =====
            mkdir -p "$HOME/strapi-uploads"
            if [ -d public/uploads ] && [ ! -L public/uploads ]; then
              cp -a public/uploads/. "$HOME/strapi-uploads/" 2>/dev/null || true
              rm -rf public/uploads
            fi
            ln -sfn "$HOME/strapi-uploads" public/uploads
            ls -l public | grep uploads || true
            # =========================================================

            # build/start (your deploy script may already do this)
            if [ -x ./deploy.sh ]; then
              bash ./deploy.sh
            else
              yarn install --frozen-lockfile
              yarn build
            fi

            # reload via local PM2 (harmless if deploy.sh already did it)
            if [ -f ./ecosystem.config.js ]; then
              if [ -x ./node_modules/.bin/pm2 ]; then
                ./node_modules/.bin/pm2 reload ecosystem.config.js --update-env || ./node_modules/.bin/pm2 start ecosystem.config.js
              else
                npx pm2 reload ecosystem.config.js --update-env || npx pm2 start ecosystem.config.js
              fi
            fi

            echo "Deploy finished."
