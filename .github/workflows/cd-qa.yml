
name: Continuous Deployment Workflow QA

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

jobs:
  build:
    name: Builds the strapi CMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js (CI build)
        uses: actions/setup-node@v4
        with:
          node-version: '18.20.5'
      - name: Install deps (npm)
        run: npm ci
      - name: Build
        run: npm run build

  deploy:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Deploy to QA
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.QA_SERVER }}
          username: ${{ secrets.QA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.QA_PORT }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.QA_PATH }}"
            REPO_URL="https://github.com/SiLeBAT/zoonotify-cms.git"
            BRANCH="${{ steps.extract_branch.outputs.branch }}"

            echo "==> Load shell profile (if any)"
            [ -f ~/.bashrc ] && . ~/.bashrc || true
            [ -f ~/.profile ] && . ~/.profile || true

            echo "==> Ensure Node 18.20.5 (nvm)"
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm install 18.20.5
              nvm use 18.20.5
            fi
            # harden PATH in case shell didn't load nvm
            if [ -x "$HOME/.nvm/versions/node/v18.20.5/bin/node" ]; then
              export PATH="$HOME/.nvm/versions/node/v18.20.5/bin:$PATH"
            fi
            node -v

            echo "==> Fresh clone to $APP_DIR"
            rm -rf "${APP_DIR}.old"
            [ -d "$APP_DIR" ] && mv "$APP_DIR" "${APP_DIR}.old" || true
            git clone "$REPO_URL" "$APP_DIR"

            echo "==> Put environment file"
            cp "$HOME/env.qa" "$APP_DIR/.env" || true

            cd "$APP_DIR"
            git fetch origin
            git checkout "$BRANCH" || git checkout -B "$BRANCH" "origin/$BRANCH"
            git pull --ff-only || true

            echo "==> Ensure persistent uploads (idempotent)"
            mkdir -p "$HOME/strapi-uploads"
            if [ -d public/uploads ] && [ ! -L public/uploads ]; then
              cp -a public/uploads/. "$HOME/strapi-uploads/" 2>/dev/null || true
              rm -rf public/uploads
            fi
            ln -sfn "$HOME/strapi-uploads" public/uploads
            ls -l public | grep uploads || true

            echo "==> Install & build with npm (avoid yarn / engine mismatch)"
            npm ci
            npm run build

            echo "==> Reload/Start with PM2 (via npx)"
            if [ -f ./ecosystem.config.js ]; then
              npx pm2 reload ecosystem.config.js --update-env || npx pm2 start ecosystem.config.js
            else
              echo "WARN: ecosystem.config.js not found; skipping PM2"
            fi

            echo "==> Deploy finished."
