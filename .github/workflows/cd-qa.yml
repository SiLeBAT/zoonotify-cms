
name: Continuous Deployment Workflow QA

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build:
    name: 'Builds the strapi CMS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '18.20.5'
      - name: Install dependencies
        run: yarn install
      - name: Build
        run: yarn build

  deploy:
    name: 'Deploy to QA'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Deploy to QA
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.QA_SERVER }}
          username: ${{ secrets.QA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.QA_PORT }}
          command_timeout: 30m
          script: |
            set -e
            source ~/.bashrc || true
            source ~/.profile || true

            # fresh clone
            cd ~
            rm -rf cms.old
            [ -d zoonotify-cms ] && mv zoonotify-cms cms.old || true
            git clone https://github.com/SiLeBAT/zoonotify-cms.git

            # env
            cp ~/env.qa ${{ secrets.QA_PATH }}/.env

            # checkout the pushed branch
            cd ${{ secrets.QA_PATH }}
            git checkout ${{ steps.extract_branch.outputs.branch }}
            git pull --ff-only

            # ▼ LINE 1: ensure persistent folder + relink uploads (idempotent)
            mkdir -p ~/strapi-uploads
            bash scripts/ensure-uploads-symlink.sh

            # build/start (your deploy script may already do this)
            bash ./deploy.sh

            # ▼ LINE 2: reload via local PM2 (safe even if deploy.sh already reloaded)
            ./node_modules/.bin/pm2 reload ecosystem.config.js --update-env || true
