
name: Continuous Deployment Workflow QA

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

jobs:
  build:
    name: Builds the strapi CMS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '18.20.5'
      - name: Install dependencies
        run: yarn install
      - name: Build
        run: yarn build

  deploy:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Deploy to QA
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.QA_SERVER }}
          username: ${{ secrets.QA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.QA_PORT }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            # Helpful vars
            APP_DIR="${{ secrets.QA_PATH }}"
            REPO_URL="https://github.com/SiLeBAT/zoonotify-cms.git"
            BRANCH="${{ steps.extract_branch.outputs.branch }}"

            # Load shell profile if present
            [ -f ~/.bashrc ] && source ~/.bashrc || true
            [ -f ~/.profile ] && source ~/.profile || true

            # OPTIONAL: use Node 18 if nvm exists
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
              nvm install 18 >/dev/null 2>&1 || true
              nvm use 18 >/dev/null 2>&1 || true
            fi

            echo "Cloning branch '$BRANCH' to $APP_DIR ..."
            rm -rf "${APP_DIR}.old"
            [ -d "$APP_DIR" ] && mv "$APP_DIR" "${APP_DIR}.old" || true
            git clone "$REPO_URL" "$APP_DIR"

            # env file
            cp "$HOME/env.qa" "$APP_DIR/.env" || true

            cd "$APP_DIR"
            # ensure correct branch
            git fetch origin
            git checkout "$BRANCH" || git checkout -B "$BRANCH" "origin/$BRANCH"
            git pull --ff-only || true

            # ===== Ensure persistent uploads (NO external script needed) =====
            mkdir -p "$HOME/strapi-uploads"
            if [ -d public/uploads ] && [ ! -L public/uploads ]; then
              cp -a public/uploads/. "$HOME/strapi-uploads/" 2>/dev/null || true
              rm -rf public/uploads
            fi
            ln -sfn "$HOME/strapi-uploads" public/uploads
            ls -l public | grep uploads || true
            # =================================================================

            # Build & start
            if [ -x ./deploy.sh ]; then
              bash ./deploy.sh
            else
              # Fallback if deploy.sh is missing
              if [ -f yarn.lock ]; then
                yarn install --frozen-lockfile
                yarn build
              else
                npm ci --omit=dev
                npm run build
              fi
            fi

            # Reload/start via local PM2 (zero-downtime if already running)
            if [ -f ./ecosystem.config.js ]; then
              ./node_modules/.bin/pm2 reload ecosystem.config.js --update-env || ./node_modules/.bin/pm2 start ecosystem.config.js
            else
              # last resort: try app name
              ./node_modules/.bin/pm2 reload zoonotify-cms || true
            fi

            echo "Deployed successfully."
