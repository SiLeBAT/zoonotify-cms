name: Continuous Delivery Workflow QA

# Auto-deploys develop to QA on every push. Manual dispatch on an rc-* branch
# doubles as the "stabilize the release candidate on QA" step (ADR 0001, step 3).
on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: deploy-qa
  cancel-in-progress: true

jobs:
  build:
    name: 'Builds the strapi CMS'
    runs-on: ubuntu-latest
    # Expose the pinned Node version (from .nvmrc) to the deploy job.
    outputs:
      node_version: ${{ steps.nvmrc.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
      - name: Read Node version from .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build

  deploy:
    name: 'Deploy to QA'
    runs-on: ubuntu-latest
    needs: build
    environment: QA
    timeout-minutes: 25
    steps:
      # we need the branch name you just pushed (develop or PR head)
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Deploy to QA
        uses: appleboy/ssh-action@334f9259f2f8eb3376d33fa4c684fff373f2c2a6 # v0.1.10
        with:
          host: ${{ secrets.QA_SSH_HOST }}
          username: ${{ secrets.QA_SSH_USER }}
          key: ${{ secrets.QA_SSH_KEY }}
          port: ${{ vars.QA_SSH_PORT }}
          command_timeout: 30m
          debug: true
          script: |
            # Without errexit a failing deploy.sh (e.g. `yarn build`) fell
            # through to "Deploy finished." and the run went green while the
            # old process kept serving (issue 085). Same flags as cd-prod.yml.
            set -euo pipefail
            set -x

            APP_DIR="${{ vars.QA_DEPLOY_DIR }}"
            REPO_URL="https://github.com/SiLeBAT/zoonotify-cms.git"
            BRANCH="${{ steps.extract_branch.outputs.branch }}"
            # Node version comes from the repo's .nvmrc (via the build job).
            NODE_VERSION="${{ needs.build.outputs.node_version }}"

            # load shell profile if present
            [ -f ~/.bashrc ] && . ~/.bashrc || true
            [ -f ~/.profile ] && . ~/.profile || true

            # ensure the pinned Node version on the server (avoids engine mismatch)
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # Match the prod deploy: source with --no-use so nvm's auto-use
              # (which returns non-zero when no default alias is set) cannot
              # abort the script, then select the pinned Node version. nvm is
              # not errexit/nounset-safe, so relax both around it and check.
              set +eu
              . "$NVM_DIR/nvm.sh" --no-use
              nvm install "$NODE_VERSION"
              nvm use "$NODE_VERSION"
              nvm_status=$?
              set -eu
              if [ "$nvm_status" -ne 0 ]; then
                echo "ERROR: failed to select Node $NODE_VERSION via nvm" >&2
                exit 1
              fi
            fi

            # Match the prod deploy: put yarn on PATH, since the non-interactive
            # SSH shell doesn't run the ~/.bashrc lines that add it.
            export PATH="$HOME/.yarn/bin:$PATH"

            echo "==> Fresh clone into $APP_DIR"
            cd ~
            rm -rf "${APP_DIR}.old"
            [ -d "$APP_DIR" ] && mv "$APP_DIR" "${APP_DIR}.old" || true
            git clone "$REPO_URL" "$APP_DIR"

            echo "==> Put environment file"
            cp "$HOME/env.qa" "$APP_DIR/.env" || true

            cd "$APP_DIR"
            git fetch origin
            git checkout "$BRANCH" || git checkout -B "$BRANCH" "origin/$BRANCH"
            git pull --ff-only || true

            # QA reports the deployed commit instead of the package version:
            # version-injector reads .commit-hash and sends it as the
            # `cms-commit` response header, which the client footer shows.
            # Production never writes the file, so it keeps reporting the
            # version. Deliberately NOT an .env entry -- appending to .env
            # glues onto the last credential line when that file has no
            # trailing newline, which fails silently.
            echo "==> Record deployed commit"
            git rev-parse --short HEAD > .commit-hash
            echo "Stamped .commit-hash: $(cat .commit-hash)"

            bash ./deploy.sh

            # pm2 returns before Strapi has booted, and a process that never
            # came up would leave the old one's port answering. Wait until the
            # app reports the commit just stamped.
            EXPECTED="$(cat .commit-hash)"
            PORT="$(grep -E '^PORT=' .env | tail -n1 | cut -d= -f2 | tr -d "\"'\r" || true)"
            PORT="${PORT:-1337}"
            echo "==> Waiting for cms-commit: $EXPECTED on port $PORT"
            served=""
            for _ in $(seq 1 60); do
              served="$(curl -s -o /dev/null -D - "http://127.0.0.1:$PORT/_health" \
                | tr -d '\r' | awk -F': ' 'tolower($1) == "cms-commit" { print $2 }' || true)"
              [ "$served" = "$EXPECTED" ] && break
              sleep 5
            done
            if [ "$served" != "$EXPECTED" ]; then
              echo "ERROR: cms-commit is '${served}', expected '$EXPECTED' after 5 minutes" >&2
              exit 1
            fi

            echo "Deploy finished."
