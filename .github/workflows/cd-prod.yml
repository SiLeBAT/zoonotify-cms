name: Continuous Delivery Workflow Production

# Production deploys are MANUAL ONLY and tag-pinned (ADR 0001, step 6). Trigger
# from the Actions tab ("Run workflow") and provide the exact release tag to ship.
#
# Secrets/variables are scoped to the `production` GitHub environment (below):
#   PROD_SSH_HOST   (secret)   - hostname / IP of the production server
#   PROD_SSH_USER   (secret)   - SSH user
#   PROD_SSH_KEY    (secret)   - private key authorised for PROD_SSH_USER@PROD_SSH_HOST
#   PROD_SSH_PORT   (variable) - SSH port (omit to default to 22)
#   PROD_DEPLOY_DIR (variable) - app directory relative to the SSH user's home
#
# Server prerequisites (set up once, out of band):
#   - $HOME/env.prod : the production .env, copied into the app on each deploy
#   - nvm available (the Node version is read from the repo's .nvmrc)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy to PRODUCTION (e.g. v4.4.0)'
        required: true
        type: string

# Never let two production deploys run at the same time.
concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  build:
    name: 'Build the strapi CMS (gate)'
    runs-on: ubuntu-latest
    # Expose the deployed tag's pinned Node version to the deploy job.
    outputs:
      node_version: ${{ steps.nvmrc.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Reads the .nvmrc of the checked-out tag, so each release builds with
          # the Node version it pinned (single source of truth). Deploying a tag
          # older than .nvmrc's introduction is not supported.
          node-version-file: '.nvmrc'
      - name: Read Node version from .nvmrc
        id: nvmrc
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build

  deploy:
    name: 'Deploy to Production'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    # Bind to a GitHub "production" environment so branch/reviewer
    # protection rules (if configured) gate this deploy.
    environment: production
    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ vars.PROD_SSH_PORT }}
          command_timeout: 30m
          debug: true
          script: |
            set -euo pipefail
            set -x

            APP_DIR="${{ vars.PROD_DEPLOY_DIR }}"
            REPO_URL="https://github.com/SiLeBAT/zoonotify-cms.git"
            REF="${{ inputs.tag }}"
            # Node version comes from the deployed tag's .nvmrc (via the build job).
            NODE_VERSION="${{ needs.build.outputs.node_version }}"

            # load shell profile if present
            [ -f ~/.bashrc ] && . ~/.bashrc || true
            [ -f ~/.profile ] && . ~/.profile || true

            # ensure the pinned Node version on the server (avoids engine mismatch)
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # nvm's auto-use (triggered when sourcing nvm.sh) returns a
              # non-zero exit when no default alias is set, which aborts the
              # script under `set -e`. Source with --no-use to skip it, and
              # disable errexit across nvm setup as a belt-and-suspenders guard.
              # Then verify the version was selected and fail loudly if not.
              set +e
              . "$NVM_DIR/nvm.sh" --no-use
              nvm install "$NODE_VERSION"
              nvm use "$NODE_VERSION"
              nvm_status=$?
              set -e
              if [ "$nvm_status" -ne 0 ]; then
                echo "ERROR: failed to select Node $NODE_VERSION via nvm" >&2
                exit 1
              fi
            fi

            # Put yarn on PATH. The non-interactive SSH shell does NOT run the
            # ~/.bashrc lines that add it (they are gated to interactive shells),
            # so a bare `yarn` (as used by the live backup.sh) would not resolve.
            export PATH="$HOME/.yarn/bin:$PATH"

            # Refuse to deploy without a production env file.
            if [ ! -f "$HOME/env.prod" ]; then
              echo "ERROR: $HOME/env.prod not found on server. Aborting." >&2
              exit 1
            fi

            # 1) Back up the CURRENT live deployment before we replace it.
            #    The running app dir has node_modules + .env; a fresh clone would not.
            #    Best-effort: the `strapi export` is the recovery point, but a
            #    non-zero exit from the on-server backup.sh (e.g. an older copy
            #    whose prune `xargs rm` fails when <=5 backups exist) must NOT
            #    abort the deploy. Warn loudly instead.
            if [ -d "$APP_DIR/node_modules" ] && [ -f "$APP_DIR/.env" ]; then
              echo "==> Backing up current production data"
              if ( cd "$APP_DIR" && bash ./backup.sh ); then
                echo "==> Backup completed"
              else
                echo "WARNING: pre-deploy backup.sh exited non-zero; continuing." >&2
                echo "         Confirm a backup archive was written before relying on rollback." >&2
              fi
            else
              echo "==> No existing deployment found; skipping pre-deploy backup"
            fi

            # 2) Fresh clone into $APP_DIR (previous copy kept as .old for rollback)
            echo "==> Fresh clone into $APP_DIR"
            cd ~
            rm -rf "${APP_DIR}.old"
            [ -d "$APP_DIR" ] && mv "$APP_DIR" "${APP_DIR}.old" || true
            git clone "$REPO_URL" "$APP_DIR"

            # 3) Put the production environment file in place
            echo "==> Put environment file"
            cp "$HOME/env.prod" "$APP_DIR/.env"

            # 4) Check out the exact requested ref and deploy
            cd "$APP_DIR"
            git fetch --all --tags
            git checkout "$REF"

            bash ./deploy.sh

            echo "Production deploy of '$REF' finished."
